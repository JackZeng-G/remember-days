services:
  anniversary:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anniversary-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # 持久化数据目录
      - ./data:/app/data
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production-session-secret}
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --quiet --tries=1 --spider http://localhost:8080/ 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s